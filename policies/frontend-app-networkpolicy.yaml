apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-app-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: frontend-app
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
